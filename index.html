<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Focus</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a' stroke='%23262626' stroke-width='2'/%3E%3Cpath d='M19 15h13c11.5 0 19 7 19 17s-7.5 17-19 17H19V15zm8 7v20h5c6.8 0 11-4.2 11-10s-4.2-10-11-10h-5z' fill='%23ffffff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <!-- Ambient Background Gradients -->
    <div class="ambient-glow glow-blue"></div>
    <div class="ambient-glow glow-purple"></div>

    <div class="app-container">
        <!-- Main Content Area: Timer & Thoughts -->
        <main class="main-content">
            
            <!-- Timer Section -->
             <!-- Timer Section (Orbital UI) -->
            <section class="timer-section glass-panel setup-mode" id="timer-section">
                
                <!-- Top Tabs: Focus / Rest -->
                <div class="timer-mode-tabs" id="timer-mode-tabs">
                    <button class="mode-tab active" data-mode="work">Focus Time</button>
                    <button class="mode-tab" data-mode="rest">Rest Time</button>
                </div>

                <!-- Setup Mode Prompt -->
                <h2 class="setup-prompt" dir="rtl">چقدر می‌خواهی تمرکز کنی؟</h2>

                <!-- Active Task Focus Banner (Moved right above the timer for Active Mode) -->
                <div id="active-task-banner" class="active-task-banner">
                    <span class="active-task-label">🎯 Focusing on:</span>
                    <span id="active-task-name" class="active-task-name">No task selected</span>
                    <span id="active-task-time" class="active-task-time hidden"></span>
                    <button id="btn-clear-active-task" class="active-task-clear hidden" title="Unselect active task">×</button>
                </div>

                <!-- Orbital Slider & Timer Display -->
                <div class="orbital-slider-container">
                    <svg class="orbital-svg" viewBox="0 0 300 300">
                        <defs>
                            <!-- Gradient for the active progress arc -->
                            <linearGradient id="arc-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="var(--accent-blue)" />
                                <stop offset="100%" stop-color="var(--accent-purple)" />
                            </linearGradient>
                            <!-- Glow filter for the draggable dot -->
                            <filter id="dot-glow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>

                        <!-- Background Track (Dark Circle) -->
                        <circle class="orbital-track" cx="150" cy="150" r="135" />
                        
                        <!-- Progress Arc (Starts from top due to -90deg transform) -->
                        <circle class="orbital-arc" id="orbital-arc" cx="150" cy="150" r="135" 
                                stroke="url(#arc-gradient)" transform="rotate(-90 150 150)" />
                        
                        <!-- Draggable Glowing Dot (Positioned via JS cx/cy) -->
                        <circle class="orbital-dot" id="orbital-dot" cx="150" cy="15" r="10" filter="url(#dot-glow)" />
                    </svg>

                   <!-- Center Display Content -->
                    <div class="timer-center-content">
                        <!-- Editable Time Display -->
                        <div class="time-display-wrapper" id="time-display-wrapper" title="Click to type manually">
                            <span id="time-display" class="time-text">25:00</span>
                            <!-- Hidden input for typing the minutes directly -->
                            <input type="text" id="time-edit-input" class="time-edit-input hidden" placeholder="25" autocomplete="off" maxlength="3">
                        </div>
                        
                        <!-- Dynamic Hints (Removed 'hidden' from active-hint) -->
                        <span id="setup-hint" class="timer-hint setup-hint">(Tap numbers to edit)</span>
                        <span id="active-hint" class="timer-hint active-hint">Keep going, you got this!</span>
                    </div>
                </div>
                     
                <!-- Bottom Controls: Setup Mode -->
                <div class="timer-actions setup-actions" id="setup-actions">
                    <button id="btn-set-focus" class="btn primary btn-large">SET FOCUS TIME</button>
                    <button id="btn-cancel-setup" class="btn-text">Cancel</button>
                </div>

                <!-- Bottom Controls: Active Session Mode -->
                <div class="timer-actions active-actions" id="active-actions">
                    <div class="active-btns-row">
                        <button id="btn-toggle" class="btn primary-outline">II PAUSE</button>
                        <button id="btn-reset" class="btn secondary">↺ RESET</button>
                    </div>
                    <button id="btn-cancel-session" class="btn-text danger-text">Cancel session</button>
                </div>

                <!-- Kept for backward compatibility with checkDailyStats in app.js, hidden from layout -->
                <div class="hidden-stats" style="display: none;">
                    <span id="stats-count">0</span>
                    <span id="date-shamsi"></span>
                    <span id="date-gregorian"></span>
                </div>
            </section>

            <!-- Thoughts Section (Bottom) -->
            <section class="thoughts-section glass-panel">
                <div class="section-header">
                    <h3>Thoughts & Brain Dump</h3>
                    <button class="btn secondary btn-sm" data-spoiler-group="thoughts" title="Toggle spoiler for all thoughts">
                        👁️ Spoiler All
                    </button>
                </div>
                <form id="thought-form" class="input-group">
                    <input type="text" id="thought-input" placeholder="Jot down a quick thought..." autocomplete="off">
                    <button type="submit" class="btn primary">+</button>
                </form>
                <ul id="thoughts-list" class="item-list"></ul>
            </section>
        </main>

        <!-- Sidebar: Works / To-Do List -->
        <aside class="sidebar glass-panel">
            <div class="section-header">
                <div class="header-actions">
                    <button id="btn-export-report" class="btn secondary btn-sm" title="Download Daily Report Image (PNG)">
                        📸 Export
                    </button>
                    <button class="btn secondary btn-sm" data-spoiler-group="works" title="Toggle spoiler for all tasks">
                        👁️ Spoiler All
                    </button>
                    <button id="btn-open-trash" class="btn secondary btn-sm trash-trigger" title="Open Recycle Bin">
                        🗑️ <span id="trash-count">0</span>
                    </button>
                </div>
            </div>

            <!-- Folder Filter Pills Bar: [ All ] [ 📁 Folder ] [ + ] -->
            <div id="folder-tabs-bar" class="folder-tabs-bar"></div>

            <!-- Inline New Folder Creation Row (Hidden by default, toggled by [+] pill) -->
            <form id="new-folder-form" class="new-folder-form hidden">
                <input type="text" id="new-folder-input" placeholder="Folder name (e.g. زبان)..." autocomplete="off">
                <button type="submit" class="action-btn save-edit-btn" title="Create Folder">✓</button>
                <button type="button" id="btn-cancel-folder" class="action-btn cancel-edit-btn" title="Cancel">✕</button>
            </form>

            <form id="work-form" class="input-group">
                <input type="text" id="work-input" placeholder="Add a new task..." autocomplete="off">
                <input type="number" id="work-time-input" class="time-assign-input" placeholder="Min" min="1" max="999" title="Allocated time in minutes ( e.g. 60 )">
                <button type="submit" class="btn primary">+</button>
            </form>
            <ul id="works-list" class="item-list"></ul>
        </aside>
    </div>

    <!-- Recycle Bin Modal -->
    <div id="trash-modal" class="modal-overlay hidden">
        <div class="modal-panel glass-panel">
            <div class="section-header">
                <h3>🗑️ Recycle Bin (Archived)</h3>
                <div class="header-actions">
                    <button id="btn-empty-trash" class="btn secondary btn-sm danger-text" title="Permanently delete all items">
                        Empty All
                    </button>
                    <button id="btn-close-trash" class="action-btn delete-btn" title="Close">×</button>
                </div>
            </div>
            <ul id="trash-list" class="item-list trash-items"></ul>
        </div>
    </div>

    <!-- 10-Second Session Preparation Overlay -->
    <div id="prep-overlay" class="modal-overlay hidden">
        <div class="modal-panel glass-panel prep-panel" dir="rtl">
            <div class="prep-header">
                <span class="prep-badge">آماده‌سازی ذهن (<strong id="prep-countdown">10</strong>s)</span>
                <button id="btn-skip-prep" class="btn secondary btn-sm">رد کردن ⏭️</button>
            </div>
            <h3 class="prep-title">🚀 در حال شروع سشن جدید هستیم...</h3>
            <ul id="prep-messages" class="prep-list"></ul>
            <p id="prep-footer" class="prep-footer"></p>
            <div class="prep-progress-track">
                <div id="prep-progress-bar" class="prep-progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Scripts loaded sequentially to avoid CORS issues locally -->
    <script src="storage.js"></script>
    <script src="timer.js"></script>
    <script src="exporter.js"></script>
    <script src="app.js"></script>
    
</body>
</html>
